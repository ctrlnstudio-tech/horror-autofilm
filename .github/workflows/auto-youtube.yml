name: Auto Horror YouTube Upload

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/run-now.txt
  schedule:
    # GitHub cron uses UTC. Primary runs: 06:05, 11:05, 18:05 in Asia/Bangkok.
    - cron: "5 23 * * *"
    - cron: "5 4 * * *"
    - cron: "5 11 * * *"
    # Backup runs for GitHub schedule delays/skips. A cache lock prevents duplicate uploads per slot.
    - cron: "25 23 * * *"
    - cron: "25 4 * * *"
    - cron: "25 11 * * *"

concurrency:
  group: horror-autofilm-upload
  cancel-in-progress: false

jobs:
  create-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Compute upload slot
        id: slot
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime, timezone, timedelta
          import os

          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          if event_name != "schedule":
              print(f"slot_id=manual-{os.environ.get('GITHUB_RUN_ID', 'local')}")
              print("scheduled=false")
              raise SystemExit

          bkk = datetime.now(timezone.utc) + timedelta(hours=7)
          slot_hour = min((6, 11, 18), key=lambda hour: abs((bkk.hour * 60 + bkk.minute) - (hour * 60 + 5)))
          print(f"slot_id={bkk:%Y-%m-%d}-{slot_hour:02d}")
          print("scheduled=true")
          PY

      - name: Restore schedule slot lock
        id: slot-lock
        uses: actions/cache/restore@v4
        with:
          path: .schedule-slot-lock
          key: horror-autofilm-${{ steps.slot.outputs.slot_id }}

      - name: Create and upload one horror short
        if: steps.slot-lock.outputs.cache-hit != 'true'
        env:
          YOUTUBE_CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: python3 auto_worker.py --once --upload

      - name: Mark schedule slot done
        if: steps.slot.outputs.scheduled == 'true' && steps.slot-lock.outputs.cache-hit != 'true'
        run: |
          mkdir -p .schedule-slot-lock
          date -u > .schedule-slot-lock/done.txt

      - name: Save schedule slot lock
        if: steps.slot.outputs.scheduled == 'true' && steps.slot-lock.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .schedule-slot-lock
          key: horror-autofilm-${{ steps.slot.outputs.slot_id }}
