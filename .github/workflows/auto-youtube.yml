name: Auto Horror YouTube Upload

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. These equal 06:00, 11:00, 18:00 in Asia/Bangkok.
    - cron: "0 23,4,11 * * *"

jobs:
  create-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Create and upload one horror short
        env:
          YOUTUBE_CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: python3 auto_worker.py --once --upload
